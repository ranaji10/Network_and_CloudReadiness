# Install once: uv run pre-commit install   (or: pipx install pre-commit && pre-commit install)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10240"]
      - id: detect-private-key
      - id: check-yaml
        exclude: ^(infra/|\.github/workflows/)   # terraform-ish yaml and GH templates are checked elsewhere
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-client-data
        name: no client data in commit
        entry: uv run python scripts/check_no_client_data.py
        language: system
        pass_filenames: false
      - id: portability
        name: no account-specific identifiers
        entry: uv run python scripts/check_portability.py
        language: system
        pass_filenames: false
