[project]
name = "readiness"
version = "0.2.0"
description = "Network security, cloud readiness and agentic-AI readiness assessor: scores a business's existing documents against configurable control frameworks and recommends GCP / AWS / open-source actions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "pypdf>=5",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "structlog>=24",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Provider adapters are optional so the core never hard-depends on one cloud.
gcp = [
  "google-genai>=1.0",
  "google-cloud-storage>=2.17",
  "google-cloud-secret-manager>=2.20",
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
]
adk = ["google-adk>=1.0"]
aws = ["boto3>=1.34"]
anthropic = ["anthropic>=0.40"]
pii = ["presidio-analyzer>=2.2"]
all = ["readiness[gcp,adk,aws,anthropic]"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
readiness = "readiness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readiness"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the default configuration inside the wheel so `pip install readiness` works without a checkout.
"config" = "readiness/_bundled_config"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/readiness"]
