# Google Cloud Build pipeline. One trigger per environment, each in its own GCP project, all running this
# same file (docs/decisions/ADR-20261103-one-project-per-environment.md, docs/planning/RELEASE_PLAN.md):
#   dev      push to main            _ENV=dev      _DEPLOY as the developer likes
#   staging  push to main            _ENV=staging  _DEPLOY=true, automatic
#   prod     tag vX.Y.Z + approval   _ENV=prod     _DEPLOY=true, after a release owner approves the build
#
# Stage 1 (always): lint, tests, policy checks, container build  -> fixes the "red build" with no cloud resources.
# Stage 2 (gated):  push to Artifact Registry + deploy to Cloud Run when _DEPLOY=true.
# Stage 3 (gated):  deploy the ADK agent to Vertex AI Agent Engine when _DEPLOY_AGENT=true, updating the
#                   instance named by _AGENT_ENGINE_ID so the agent registered in Gemini Enterprise follows the repo.
#
# Nothing here is account-specific: PROJECT_ID comes from the build, everything else is a substitution
# set on the trigger (see infra/terraform/gcp/trigger.tf and docs/runbooks/DEPLOY_GCP.md). Per-environment
# differences (buckets, retention, model egress, ingress) are Terraform's business, not this file's: the deploy
# step only *updates* the env vars it owns and leaves the rest of the service as Terraform applied it.
substitutions:
  _ENV: dev                    # dev | staging | prod: the environment this trigger's project serves
  _REGION: asia-south1
  _AR_REPO: readiness
  _SERVICE: readiness-api
  _DEPLOY: "false"
  _RUNTIME_SA: ""              # e.g. readiness-runtime@PROJECT.iam.gserviceaccount.com (set by Terraform)
  _INGRESS: all                # all (IAM-protected public endpoint) | internal-and-cloud-load-balancing (behind IAP/LB)
  _DEPLOY_AGENT: "false"
  _AGENT_ENGINE_ID: ""         # resource id of an existing Agent Engine instance to update; empty = create new
  _AGENT_SA: ""                # runtime identity for the agent (set by Terraform: readiness-agent-<env>)
  _AGENT_DISPLAY_NAME: readiness-assessor
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}

options:
  dynamic_substitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1500s

steps:
  - id: quality-gate
    name: ghcr.io/astral-sh/uv:python3.12-bookworm  # not -slim: scripts/check_*.py need git
    entrypoint: bash
    env: ["UV_LINK_MODE=copy", "UV_PYTHON_DOWNLOADS=never"]
    args:
      - -c
      - |
        set -euo pipefail
        uv sync --frozen --group dev
        # Local OCR engine for tests/test_extract_ocr.py (ING-08); the image runs as root, so plain apt-get works.
        # Those tests skip with a reason if the install is ever unavailable, so the gate stays green either way.
        apt-get update -qq && apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
        uv run ruff check src tests scripts
        uv run ruff format --check src tests scripts
        uv run mypy
        uv run pytest -q
        uv run python scripts/check_portability.py
        uv run python scripts/check_no_client_data.py
        uv run python scripts/check_no_system_access.py
        uv run python scripts/render_tracker.py --check
        uv run python scripts/export_openapi.py --check

  - id: secret-scan
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: gitleaks
    args: ["dir", ".", "--config", ".gitleaks.toml", "--no-banner", "--redact", "--exit-code", "1"]

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${SHORT_SHA}", "-t", "${_IMAGE}:latest", "."]

  - id: push-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_DEPLOY}" != "true" ]; then echo "push skipped (_DEPLOY=${_DEPLOY})"; exit 0; fi
        docker push "${_IMAGE}:${SHORT_SHA}" && docker push "${_IMAGE}:latest"
        # A tag build (prod trigger on vX.Y.Z) also publishes the release tag, so a rollback is
        # `gcloud run deploy --image ${_IMAGE}:vX.Y.Z` (see docs/planning/RELEASE_PLAN.md, Promotion).
        if [ -n "${TAG_NAME}" ]; then
          docker tag "${_IMAGE}:${SHORT_SHA}" "${_IMAGE}:${TAG_NAME}" && docker push "${_IMAGE}:${TAG_NAME}"
        fi

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_DEPLOY}" != "true" ]; then echo "deploy skipped (_DEPLOY=${_DEPLOY})"; exit 0; fi
        gcloud run deploy "${_SERVICE}" \
          --image "${_IMAGE}:${SHORT_SHA}" \
          --region "${_REGION}" \
          --platform managed \
          --no-allow-unauthenticated \
          --ingress "${_INGRESS}" \
          --no-cpu-throttling \
          ${_RUNTIME_SA:+--service-account "${_RUNTIME_SA}"} \
          --update-env-vars "READINESS_PROVIDER=gcp,READINESS_ENV=${_ENV},GOOGLE_CLOUD_PROJECT=${PROJECT_ID}" \
          --quiet
        # --update-env-vars, not --set-env-vars: the latter wipes every variable Terraform put on the service
        # (bucket names, READINESS_LLM_PROVIDER, READINESS_ALLOW_LLM_EGRESS, redaction mode). Those are the
        # per-environment contract and stay owned by infra/terraform/gcp/envs/<env>.tfvars.

  - id: deploy-agent-engine
    name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    entrypoint: bash
    env: ["UV_LINK_MODE=copy", "UV_PYTHON_DOWNLOADS=never"]
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_DEPLOY_AGENT}" != "true" ]; then echo "agent deploy skipped (_DEPLOY_AGENT=${_DEPLOY_AGENT})"; exit 0; fi
        uv sync --frozen --no-dev --extra gcp --extra adk
        # Never create a duplicate instance: when no id is pinned, reuse the newest one with this display name.
        # Shell variables are written as $$VAR: Cloud Build expands single-$ references as substitutions
        # and rejects unknown ones before the build starts.
        AGENT_ID="${_AGENT_ENGINE_ID}"
        if [ -z "$$AGENT_ID" ]; then
          AGENT_ID="$$(uv run python scripts/find_agent_engine.py --project "${PROJECT_ID}" --region "${_REGION}" --display-name "${_AGENT_DISPLAY_NAME}")"
          [ -n "$$AGENT_ID" ] && echo "reusing existing Agent Runtime instance $$AGENT_ID (pin it as _AGENT_ENGINE_ID)"
        fi
        # The agent folder is the ADK app; the package and its YAML config are staged next to it with
        # --extra_packages (they land at /app/readiness and /app/config, see readiness.config). The build
        # service account's ADC is used; see docs/runbooks/DEPLOY_AGENT_ENGINE.md for the roles it needs.
        # --temp_folder must be outside src/readiness: adk stages into a folder next to the agent app by
        # default, which sits inside the very tree --extra_packages src/readiness copies (infinite recursion).
        uv run adk deploy agent_engine \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --temp_folder /tmp/readiness-agent-stage \
          --display_name "${_AGENT_DISPLAY_NAME}" \
          --extra_packages src/readiness \
          --extra_packages config \
          $${AGENT_ID:+--agent_engine_id "$$AGENT_ID"} \
          ${_AGENT_SA:+--service_account "${_AGENT_SA}"} \
          --otel_to_cloud \
          src/readiness/agents
