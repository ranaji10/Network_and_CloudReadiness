# Monthly dependency refresh. Each PR runs the full CI gate; minor/patch updates auto-merge when green
# (.github/workflows/dependabot-automerge.yml); major updates wait for a human.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]          # one PR for all action bumps, so they cannot conflict with each other
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      # The runtime image must stay on the same Python minor as the uv builder image (both 3.12), or the
      # copied .venv breaks. Bump both lines in the Dockerfile by hand; patch tags are still proposed.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
