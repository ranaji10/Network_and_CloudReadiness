# Auto-merge Dependabot PRs that are minor or patch updates once every required check is green.
# Major updates stay manual. Needs: repo setting "Allow auto-merge" on, and a ruleset on main that
# requires the quality, secrets and docker checks (see docs/collaboration/BRANCHING.md).
name: dependabot-automerge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for minor and patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Leave major updates for a human
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "major update ${{ steps.meta.outputs.dependency-names }}: review and merge manually"
