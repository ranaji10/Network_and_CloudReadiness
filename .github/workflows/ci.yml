name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/check_portability.py
      - run: uv run python scripts/check_no_client_data.py
      - run: uv run python scripts/render_tracker.py --check
      - run: uv run python scripts/export_openapi.py --check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # GITLEAKS_LICENSE is only required for organisation accounts.

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: readiness:ci
      - name: Smoke test the image (offline assessment through the API)
        run: |
          docker run -d --name readiness -p 8080:8080 -e READINESS_AUTH_DISABLED=true readiness:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 2; done
          curl -sf localhost:8080/healthz
          curl -sf -F "files=@tests/fixtures/synthetic_acme/security_policy.md" \
            "localhost:8080/assessments/upload?profile=security_only" | head -c 400
          docker rm -f readiness
